name: New Config
version: 1.0.0
schema: v1
models:
  - Name: qwen3-coder
    provider: openai
    model: qwen3-coder:30B-A3B-UD-Q4_K_XL
    apiBase: http://localhost:12434/engines/v1
    apiKey: not-needed
    roles:
      - chat
      - asutocomplete
      - edit
      - apply
  - Name: Embeddings Auto
    provider: openai
    model: qwen2.5-embeddings
    apiBase: http://localhost:12434/engines/v1
    apiKey: not-needed
    roles:
      - embeddings
  - Name: Autodetect
    provider: openai
    model: auto
    apiBase: http://localhost:1234/v1
    apiKey: lm-studio
mcpServers:
  - name: MCP_Docker
    Command: docker mcp gateway run --profile AI coding
    
